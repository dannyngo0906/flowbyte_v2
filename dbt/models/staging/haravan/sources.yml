version: 2

sources:
  - name: raw_haravan
    database: haravan
    schema: raw
    description: "Raw Haravan API payloads landed by haravan-elt extract."
    loaded_at_field: ingested_at
    freshness:
      warn_after: { count: 24, period: hour }
      error_after: { count: 48, period: hour }
    tables:
      - name: orders
        identifier: haravan_orders
        description: "Full order envelope including line_items, refunds, transactions."
        freshness:
          warn_after: { count: 6, period: hour }
          error_after: { count: 24, period: hour }
        columns:
          - name: id
            tests: [not_null, unique]
          - name: payload
            tests: [not_null]
          - name: updated_at
            tests: [not_null]

      - name: customers
        identifier: haravan_customers
        freshness:
          warn_after: { count: 12, period: hour }
          error_after: { count: 48, period: hour }
        columns:
          - name: id
            tests: [not_null, unique]

      - name: products
        identifier: haravan_products
        freshness:
          warn_after: { count: 24, period: hour }
          error_after: { count: 72, period: hour }
        columns:
          - name: id
            tests: [not_null, unique]

      - name: locations
        identifier: haravan_locations
        # Locations is full-refresh; no freshness check (every run rewrites).
        freshness: null
        columns:
          - name: id
            tests: [not_null, unique]

      - name: inventory_adjustments
        identifier: haravan_inventory_adjustments
        freshness:
          warn_after: { count: 12, period: hour }
          error_after: { count: 48, period: hour }
        columns:
          - name: id
            tests: [not_null, unique]

      - name: inventory_locations
        identifier: haravan_inventory_locations
        # Snapshot domain — daily full sweep; freshness anchored to 1 day.
        freshness:
          warn_after: { count: 36, period: hour }
          error_after: { count: 72, period: hour }
        columns:
          - name: id
            tests: [not_null, unique]
          - name: location_id
            tests: [not_null]
          - name: variant_id
            tests: [not_null]
          - name: snapshot_date
            tests: [not_null]

      - name: custom_collections
        identifier: haravan_custom_collections
        freshness:
          warn_after: { count: 48, period: hour }
          error_after: { count: 96, period: hour }
        columns:
          - name: id
            tests: [not_null, unique]

      - name: smart_collections
        identifier: haravan_smart_collections
        freshness:
          warn_after: { count: 48, period: hour }
          error_after: { count: 96, period: hour }
        columns:
          - name: id
            tests: [not_null, unique]

      - name: discounts
        identifier: haravan_discounts
        freshness:
          warn_after: { count: 24, period: hour }
          error_after: { count: 72, period: hour }
        columns:
          - name: id
            tests: [not_null, unique]

      - name: promotions
        identifier: haravan_promotions
        freshness:
          warn_after: { count: 24, period: hour }
          error_after: { count: 72, period: hour }
        columns:
          - name: id
            tests: [not_null, unique]

      - name: events
        identifier: haravan_events
        # Audit log: events are dense throughout the day; tighter freshness.
        freshness:
          warn_after: { count: 12, period: hour }
          error_after: { count: 48, period: hour }
        columns:
          - name: id
            tests: [not_null, unique]
