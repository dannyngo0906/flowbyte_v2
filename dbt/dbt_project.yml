name: haravan_elt
version: "0.1.0"
config-version: 2
profile: haravan_elt

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

vars:
  shop_timezone: "Asia/Ho_Chi_Minh"

models:
  haravan_elt:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
      core:
        +materialized: table

seeds:
  haravan_elt:
    +schema: marts
    dssp_ton_kho_thang4:
      +column_types:
        stt: integer
        sku: varchar(50)
        ten_san_pham: varchar(500)
    vn_holidays:
      +column_types:
        date: date
        holiday_name: varchar(120)
        is_public_holiday: boolean

on-run-end:
  - "GRANT USAGE ON SCHEMA staging_marts TO metabase_reader"
  - "GRANT SELECT ON ALL TABLES IN SCHEMA staging_marts TO metabase_reader"

quoting:
  database: false
  schema: false
  identifier: false
