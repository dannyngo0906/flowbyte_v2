[project]
name = "haravan-elt"
version = "0.1.0"
description = "Self-hosted ELT pipeline: Haravan Omni API -> PostgreSQL JSONB -> dbt star schema"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dinh Duy", email = "dinhduy0906@gmail.com" }]
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pyrate-limiter>=3.7,<4",
    "typer>=0.12",
    "rich>=13.7",
    "psycopg[binary]>=3.1.18",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "dbt-core>=1.7,<2.0",
    "dbt-postgres>=1.7,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-vcr>=1.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    # Used by scripts/generate_vn_holidays_seed.py only — not a runtime dep.
    "holidays>=0.50",
]

[project.scripts]
haravan-elt = "haravan_elt.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
haravan_elt = ["meta/*.sql", "meta/*.csv"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dbt/", "plans/", "docs/", "scripts/"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.11"
exclude = ["dbt/", "plans/", "docs/", "tests/fixtures/", "scripts/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=haravan_elt --cov-report=term-missing --cov-fail-under=70"
filterwarnings = ["ignore::DeprecationWarning"]
