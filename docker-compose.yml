services:
  postgres:
    image: postgres:15-alpine
    container_name: haravan_elt_pg
    environment:
      POSTGRES_USER: elt_user
      POSTGRES_PASSWORD: elt_pass
      POSTGRES_DB: haravan
    ports:
      - "5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elt_user -d haravan"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg_data:
